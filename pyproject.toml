[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svel"
version = "1.0.0"
description = "SVEL: Scientific Verification Engine Layer — Autonomous Epistemic Falsification Architecture & Deterministic Reality Engines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Samar", email = "samar@svel.ai" }
]
keywords = [
    "science",
    "verification-cage",
    "epistemic-falsification",
    "karl-popper",
    "reality-constraints",
    "thermodynamics",
    "gnn-world-model",
    "autonomous-scientist"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "rich>=13.0.0"
]

[project.urls]
Homepage = "https://github.com/Samar0-star/SVEL"
Documentation = "https://github.com/Samar0-star/SVEL/tree/main/docs"
Repository = "https://github.com/Samar0-star/SVEL.git"
"Web Platform" = "https://samar0-star.github.io/svel-web/"

[project.scripts]
svel = "backend.cli:main"
svel-verify = "demo_verification_cage:main"
